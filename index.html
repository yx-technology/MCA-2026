<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Because I Love You by Yoo Jae-Ha</title>
<!-- Turns Markdown into HTML in the browser, so the .md files can stay as they are -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.6;
    color: #24292f;
    background: #fff;
  }
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }
  h1, h2 { border-bottom: 1px solid #d0d7de; padding-bottom: .3em; }
  h5 { color: #57606a; font-size: .95em; }
  a { color: #0969da; text-decoration: none; }
  a:hover { text-decoration: underline; }
  img { max-width: 100%; }
  pre, code { background: #f6f8fa; border-radius: 6px; font-size: .9em; }
  code { padding: .15em .35em; }
  pre { padding: 14px; overflow-x: auto; }
  pre code { padding: 0; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #d0d7de; padding: 6px 12px; }
  blockquote { margin: 0; padding: 0 1em; color: #57606a; border-left: 4px solid #d0d7de; }
  .back { display: inline-block; margin-bottom: 8px; font-size: .95em; }
</style>
</head>
<body>
<main id="content">Loading…</main>

<script>
  // The homepage file. Other pages are opened as index.html#week-1.md etc.
  const HOME = 'README.md';
  const content = document.getElementById('content');

  function currentPage() {
    const h = decodeURIComponent(location.hash.slice(1));
    return /^[^:?]+\.md$/i.test(h) ? h : HOME;
  }

  async function load() {
    const page = currentPage();
    try {
      const res = await fetch(page, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const md = await res.text();

      if (typeof marked === 'undefined') {
        // If the Markdown library couldn't load, at least show the text
        content.innerHTML = '';
        const pre = document.createElement('pre');
        pre.textContent = md;
        content.appendChild(pre);
      } else {
        content.innerHTML = marked.parse(md);
      }

      if (page !== HOME) {
        content.insertAdjacentHTML('afterbegin', '<a class="back" href="#">&larr; Back to contents</a>');
      }

      const h1 = content.querySelector('h1');
      document.title = h1 ? h1.textContent : 'MCA-2026';
      window.scrollTo(0, 0);
    } catch (err) {
      content.innerHTML = '<p>Sorry, this page couldn’t be loaded: <code></code></p>' +
                          '<p><a href="#">&larr; Back to contents</a></p>';
      content.querySelector('code').textContent = page;
    }
  }

  // Clicking a link to a .md file opens it inside this page instead of as raw text
  content.addEventListener('click', function (e) {
    const a = e.target.closest('a');
    if (!a) return;
    const href = a.getAttribute('href');
    if (href && /^[^:?#]+\.md(#.*)?$/i.test(href)) {
      e.preventDefault();
      location.hash = href.split('#')[0];
    }
  });

  window.addEventListener('hashchange', load);
  load();
</script>
</body>
</html>
